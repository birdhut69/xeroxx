<!DOCTYPE html>
<html class="light" lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#075e54" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CipherPrint" />
    <meta name="description" content="CipherPrint - Zero-Knowledge, End-to-End Encrypted, RAM-Only Print Platform for Xerox Shops" />
    <title>CipherPrint | Zero-Trace Ephemeral Print</title>

    <!-- Google Fonts & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <!-- Prevent FOUC: set background before CSS loads -->
    <style>
      html, body { background-color: #f0f2f5; margin: 0; padding: 0; height: 100%; width: 100%; }
      #root { height: 100%; }
    </style>
  </head>
  <body class="antialiased">
    <div id="root"></div>

    <noscript>
      <div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:system-ui,sans-serif;text-align:center;padding:2rem;background:#f0f2f5;">
        <div style="max-width:400px;">
          <h1 style="color:#075E54;font-size:1.5rem;margin-bottom:0.5rem;">🛡️ CipherPrint</h1>
          <p style="color:#54656f;font-size:0.875rem;">JavaScript is required to run this encrypted print platform. Please enable JavaScript in your browser settings.</p>
        </div>
      </div>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.warn('[CipherPrint PWA] Service worker registration note:', err);
          });
        });
      }
    </script>
  </body>
</html>
